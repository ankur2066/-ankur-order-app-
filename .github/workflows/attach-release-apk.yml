name: Attach signed APK to a GitHub release
# Manual only. Copies the already-built, already-verified signed APK artifact of a
# "PR verification and visual artifacts" run onto an existing release (so the in-app
# update check, which reads releases/latest, can offer it). Builds nothing, deploys nothing.
on:
  workflow_dispatch:
    inputs:
      release_id: {description: 'GitHub release id', required: true}
      run_id: {description: 'Workflow run id that built the APK', required: true}
      artifact: {description: 'Artifact name, e.g. Ankur-Dryice-v1.0.78-Signed-APK', required: true}
      asset_name: {description: 'Asset file name, e.g. Ankur-Dryice-v1.0.78.apk', required: true}
      sha256: {description: 'Expected SHA-256 of the APK', required: true}
permissions:
  contents: write
  actions: read
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download, verify and attach
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT: ${{ inputs.artifact }}
          ASSET: ${{ inputs.asset_name }}
          SHA: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET" =~ ^Ankur-Dryice-v1\.0\.[0-9]{2,6}\.apk$ ]] || { echo 'bad asset name'; exit 1; }
          [[ "$RELEASE_ID" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'bad id'; exit 1; }
          gh run download "$RUN_ID" -R "$REPO" -n "$ARTIFACT" -D dl
          test -s dl/app-release.apk
          echo "$SHA  dl/app-release.apk" | sha256sum -c -
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          CERT=$("$TOOLS/apksigner" verify --print-certs dl/app-release.apk | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-fA-F]{64}).*/\1/p' | head -n 1 | tr 'A-F' 'a-f')
          test "$CERT" = 'ebb60e0b13f7b5bfa814a619d5e4acc0ee65f0e12835ad5a282c072bc9976a6e' || { echo 'Unexpected signing certificate'; exit 1; }
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/vnd.android.package-archive' --data-binary @dl/app-release.apk \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" | jq '{name,size,state,browser_download_url}'

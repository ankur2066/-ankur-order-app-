name: Phase A owner overview + real CSV + monthly expenses (no deployment)

on:
  push:
    branches:
      - codex/phase-a-owner-reports-expenses
    paths:
      - 'phase-a/**'
      - '.github/workflows/phase-a-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase-a-lint-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract current v1.0.32 app source and apply existing patch chain
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq Ankur_Order_App_Upload_GitHub.zip -d .
          python3 app-check/apply_patch.py
          python3 ui-fixes/apply_patch.py
          python3 ui-fixes/ux_qa_patch.py
          python3 ui-fixes/premium_booking_v122.py
          python3 ui-fixes/blinkit_premium_v123.py
          python3 ui-fixes/customer_home_form_v124.py
          python3 ui-fixes/customer_home_only_v125.py
          python3 ui-fixes/compact_customer_form_v126.py
          python3 ui-fixes/english_booking_v127.py
          python3 ui-fixes/readable_smooth_v128.py
          python3 notifications/apply_patch.py
          python3 notifications/client-fixes/apply_patch.py
          python3 notifications/tap-fix/apply_patch.py
          python3 ui-fixes/declutter_v132.py
          sha256sum src/components/OrderForm.tsx src/components/OrderTrackingView.tsx src/hooks/useOrderNotifications.ts src/data/rates.ts firestore.rules > /tmp/phase-a-protected-before.sha256
      - name: Apply Phase A only
        run: |
          python3 phase-a/apply_patch.py
          sha256sum src/components/OrderForm.tsx src/components/OrderTrackingView.tsx src/hooks/useOrderNotifications.ts src/data/rates.ts firestore.rules > /tmp/phase-a-protected-after.sha256
          diff -u /tmp/phase-a-protected-before.sha256 /tmp/phase-a-protected-after.sha256
      - name: Run Phase A read-only and accounting tests
        run: node --experimental-strip-types --test phase-a/phase-a.test.mjs
      - name: Lock existing Capacitor dependencies and install
        run: |
          npm install --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund @capacitor-firebase/app-check@7.5.0 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/push-notifications@7
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Required Phase A TypeScript lint and production web build
        run: |
          npm run lint && npm run build
      - name: Confirm no deployment or permission updates
        run: |
          test -f src/utils/ownerReports.ts
          test -f src/utils/expenseCycles.ts
          test -f src/components/ExpensesView.tsx
          echo 'Phase A CI passed. This workflow does not deploy Firebase, modify production, or build/install an APK.'
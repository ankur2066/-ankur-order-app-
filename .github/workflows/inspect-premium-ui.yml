name: Inspect Ankur customer UI (read-only)
on:
  push:
    branches:
      - feature/blinkit-premium-ui-20261031
    paths:
      - .github/workflows/inspect-premium-ui.yml
permissions:
  contents: read
jobs:
  inspect-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source
        run: unzip -oq Ankur_Order_App_Upload_GitHub.zip -d .
      - name: Inspect customer storefront and catalog UI only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          print("## CUSTOMER COMPONENT FILES")
          for p in sorted(Path("src/components/customer").rglob("*.tsx")): print(p)
          print("## APP LAYOUT")
          names=["src/App.tsx","src/data/catalog.ts","src/components/customer/StorefrontHome.tsx","src/components/customer/CustomerBottomNav.tsx","src/components/customer/CustomerHome.tsx"]
          names += [str(p) for p in sorted(Path("src/components/customer").glob("*.tsx")) if "Home" in p.name or "Nav" in p.name or "Product" in p.name or "Category" in p.name]
          for name in dict.fromkeys(names):
              p=Path(name)
              if not p.exists():continue
              lines=p.read_text(encoding="utf-8").splitlines()
              print(f"\n### SOURCE {name} : {len(lines)} LINES")
              for i,line in enumerate(lines[:260]): print(f"{i+1:04}: {line[:260]}")
          print("## CURRENT CSS COMPONENT SCOPE")
          css=Path("src/index.css").read_text()
          for word in ["c-home","c-hero","c-product","c-nav","c-search","storefront","bottom-nav"]:
              print(f"CSS {word}: {css.count(word)}")
          PY

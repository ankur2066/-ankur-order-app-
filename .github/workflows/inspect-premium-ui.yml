name: Inspect Ankur booking UI layout
on:
  push:
    branches: [feature/customer-home-booking-v124]
    paths: [.github/workflows/inspect-premium-ui.yml]
permissions:
  contents: read
jobs:
  inspect-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect customer booking UI source without production access
        run: |
          unzip -oq Ankur_Order_App_Upload_GitHub.zip -d .
          python3 - <<'PY'
          from pathlib import Path
          sections = [
            ('src/App.tsx', (185, 263)),
            ('src/components/customer/CustomerHome.tsx', (1, 100)),
            ('src/components/customer/CustomerHome.tsx', (180, 305)),
            ('src/components/OrderForm.tsx', (735, 970)),
          ]
          for name, (a,b) in sections:
              path=Path(name); lines=path.read_text(encoding='utf-8').splitlines()
              print(f'#### {name}: {a}-{b} of {len(lines)}')
              for i in range(a-1,min(b,len(lines))):
                  if 'firebaseConfig' in lines[i] or 'private' in lines[i].lower(): continue
                  print(str(i+1)+': '+lines[i][:230])
          PY

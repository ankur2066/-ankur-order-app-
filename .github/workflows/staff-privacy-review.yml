name: Staff phone privacy server review (NO DEPLOY)
on:
  push:
    branches: [codex/staff-phone-server-privacy-v149]
    paths: ['privacy/**', '.github/workflows/staff-privacy-review.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staff-privacy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Pure server policy tests (no external connections)
        run: node --test privacy/staffContactService.test.mjs
      - name: Build staged reviewed rules in isolated folders
        run: |
          python3 billing/review/build_rules.py
          python3 all-features/backend/stage.py --output feature-review
          python3 privacy/stage.py --base feature-review/firestore.rules --output staff-privacy-review
          test -f staff-privacy-review/REVIEW_ONLY.json
          test ! -e staff-privacy-review/firebase.json
      - name: Install isolated Firestore emulation SDK
        run: |
          mkdir -p rules-qa
          npm install --prefix rules-qa --ignore-scripts --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Real named-database read/write authorization tests
        env:
          ANKUR_RULES_QA_ROOT: ${{ github.workspace }}/rules-qa
          ANKUR_PRIVACY_RULES: ${{ github.workspace }}/staff-privacy-review/firestore.rules
        run: |
          rules-qa/node_modules/.bin/firebase emulators:exec --project demo-ankur-staff-privacy --config billing/emulator.json --only firestore 'node --test privacy/rules.test.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: StaffPhone-Privacy-REVIEW-NEVER-DEPLOY
          path: |
            staff-privacy-review/
            !staff-privacy-review/functions/node_modules/**
          retention-days: 7

name: Audit Ankur order notification source
on:
  push:
    branches:
      - feature/order-notifications-v129
    paths:
      - '.github/workflows/inspect-notifications.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate original source archive
        run: |
          unzip -t Ankur_Order_App_Upload_GitHub.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Ankur-Notification-Audit-Original-Source
          path: Ankur_Order_App_Upload_GitHub.zip
          retention-days: 2
          if-no-files-found: error

name: Product billing review tests (no deployment)
on:
  push:
    branches: [codex/all-14-phase-bc-english]
    paths: ['billing/**', '.github/workflows/product-billing-review.yml']
  workflow_dispatch:
  workflow_call:
permissions: {contents: read}
jobs:
  unit-and-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --experimental-vm-modules --test billing/billing.test.mjs billing/productOrders.test.mjs billing/productPush.test.mjs
      - run: |
          python3 billing/review/build_rules.py
          python3 billing/stage_product_push.py --output productpush-review
          node --check productpush-review/functions/productPush.mjs
          node --check productpush-review/functions/deliveryCommon.mjs
          npm install --prefix productpush-review/functions --ignore-scripts --no-audit --no-fund
          ANKUR_PRODUCT_SDK_ROOT=$PWD/productpush-review/functions node --test billing/sdk-discovery.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Product-Billing-Backend-REVIEW-NOT-DEPLOYED
          path: |
            productpush-review/
            !productpush-review/functions/node_modules/**
            billing/review/firestore.product-billing.rules
            billing/review/firestore.product-billing.diff
          retention-days: 7

name: Ankur Order Signed Release APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (greater than installed version)'
        required: true
        default: '15'
      version_name:
        description: 'Release version'
        required: true
        default: '1.0.15'
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source archive
        run: |
          test -s Ankur_Order_GitHub_Source_Upload.zip
          unzip -oq Ankur_Order_GitHub_Source_Upload.zip -d .
          test -f package-lock.json && test -f android/app/build.gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use runner Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANKUR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANKUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANKUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANKUR_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ankur-release.jks"
      - name: Build web and sync
        run: |
          npm ci
          npm run android:sync
      - name: Register native Firebase Auth plugin
        run: |
          cp ci-fixes/MainActivity.java android/app/src/main/java/com/ankurdryice/events/MainActivity.java
          grep -q FirebaseAuthenticationPlugin android/app/src/main/java/com/ankurdryice/events/MainActivity.java
      - name: Set release version directly in Gradle
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('android/app/build.gradle')
          code = os.environ['VERSION_CODE']
          name = os.environ['VERSION_NAME']
          assert code.isdecimal() and int(code) > 0
          assert name.replace('.', '').replace('-', '').replace('_', '').isalnum()
          lines = p.read_text().splitlines()
          found_code = found_name = False
          for i, line in enumerate(lines):
              if line.strip().startswith('versionCode '):
                  lines[i] = '        versionCode ' + str(int(code))
                  found_code = True
              if line.strip().startswith('versionName '):
                  lines[i] = '        versionName "' + name + '"'
                  found_name = True
          assert found_code and found_name
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Build signed release
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANKUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANKUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANKUR_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          bash ./gradlew assembleRelease --no-daemon --stacktrace -PankurKeystorePath="$RUNNER_TEMP/ankur-release.jks" -PankurStorePassword="$STORE_PASSWORD" -PankurKeyAlias="$KEY_ALIAS" -PankurKeyPassword="$KEY_PASSWORD"
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Ankur-Order-Signed-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/ankur-release.jks"

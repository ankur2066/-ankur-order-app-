name: Ankur Order Signed Release APK
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (greater than installed version)'
        required: true
        default: '15'
      version_name:
        description: 'Release version'
        required: true
        default: '1.0.15'
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract app source archive
        run: |
          test -s Ankur_Order_GitHub_Source_Upload.zip
          unzip -oq Ankur_Order_GitHub_Source_Upload.zip -d .
          test -f package-lock.json && test -f android/app/build.gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANKUR_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANKUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANKUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANKUR_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ankur-release.jks"
      - name: Build web and sync
        run: |
          npm ci
          npm run android:sync
      - name: Build signed release
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANKUR_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANKUR_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANKUR_RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x ./gradlew
          bash ./gradlew assembleRelease --no-daemon -PankurKeystorePath="$RUNNER_TEMP/ankur-release.jks" -PankurStorePassword="$STORE_PASSWORD" -PankurKeyAlias="$KEY_ALIAS" -PankurKeyPassword="$KEY_PASSWORD" -PankurVersionCode="$VERSION_CODE" -PankurVersionName="$VERSION_NAME"
      - name: Verify signed APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Ankur-Order-Signed-Release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/ankur-release.jks"

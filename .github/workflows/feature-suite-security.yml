name: Optional feature suite security emulator (no deployment)
on:
  push:
    branches: [codex/all-14-phase-bc-english, codex/staff-phone-server-privacy-v149]
    paths: ['all-features/**', 'billing/**', '.github/workflows/feature-suite-security.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Prepare isolated SDK and Rules test dependencies
        run: |
          python3 billing/review/build_rules.py
          python3 all-features/backend/stage.py --output feature-review
          npm install --prefix feature-review/functions --ignore-scripts --no-audit --no-fund
          mkdir rules-qa
          npm install --prefix rules-qa --ignore-scripts --no-audit --no-fund firebase@11 @firebase/rules-unit-testing@4 firebase-tools@14
      - name: Real Firestore transactions and cross-role Rules
        env:
          ANKUR_FEATURE_SDK_ROOT: ${{ github.workspace }}/feature-review/functions
          ANKUR_FEATURE_RULES: ${{ github.workspace }}/feature-review/firestore.rules
          ANKUR_BILLING_RULES: ${{ github.workspace }}/feature-review/firestore.rules
          ANKUR_RULES_QA_ROOT: ${{ github.workspace }}/rules-qa
        run: |
          node --experimental-vm-modules --test all-features/backend/receipts.test.mjs
          rules-qa/node_modules/.bin/firebase emulators:exec --project demo-ankur-feature-service --config billing/emulator.json --only firestore 'node --test all-features/backend/service-emulator.test.mjs all-features/backend/rules.test.mjs billing/rules.test.mjs'
      - uses: actions/upload-artifact@v4
        with:
          name: Optional-FeatureSuite-Backend-REVIEW-NOT-DEPLOYED
          path: |
            feature-review/
            !feature-review/functions/node_modules/**
          retention-days: 7
